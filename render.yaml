services:
  - type: web
    name: insighttracker
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "cd StockPricePrediction && gunicorn StockPricePrediction.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --preload"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "StockPricePrediction.settings_production"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: WEB_CONCURRENCY
        value: "2"
